name: Stable Check-Build Meshtastic Multi-Board RU

on:
  workflow_dispatch:
  repository_dispatch:
    types: [meshtastic-release]
  schedule:
    - cron: "0 2 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Heltec V4 OLED (ESP32-S3)
          - board: heltec-v4
            variant_path: variants/esp32s3/heltec_v4
            variant_define: OLED_RU
            display_name: "Heltec V4 OLED"

          # Heltec V3 (ESP32-S3)
          - board: heltec-v3
            variant_path: variants/esp32s3/heltec_v3
            variant_define: HELTEC_V3_RU
            display_name: "Heltec V3"

          # Heltec Mesh Node T114 (nRF52840)
          - board: heltec-mesh-node-t114
            variant_path: variants/nrf52840/heltec_mesh_node_t114
            variant_define: HELTEC_T114_RU
            display_name: "Heltec T114"

          # Heltec Mesh Node T096 (nRF52840)
          - board: heltec-mesh-node-t096
            variant_path: variants/nrf52840/heltec_mesh_node_t096
            variant_define: HELTEC_T096_RU
            display_name: "Heltec T096"

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: |
          pip install -U pip
          pip install platformio

      - name: Fetch latest Meshtastic release
        id: get_release
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/meshtastic/firmware/releases/latest | jq -r .tag_name)
          echo "Latest Meshtastic release: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "ru_tag=${LATEST_TAG}-ru" >> $GITHUB_OUTPUT

      - name: Check if already built
        id: check_release
        run: |
          if gh release view "${{ steps.get_release.outputs.ru_tag }}" >/dev/null 2>&1; then
            echo "Release already exists. Skipping build."
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            echo "skip_build=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop job if already built
        if: steps.check_release.outputs.skip_build == 'true'
        run: exit 0

      - name: Clone Meshtastic firmware at latest release
        if: steps.check_release.outputs.skip_build == 'false'
        run: |
          git clone --depth=1 --branch ${{ steps.get_release.outputs.tag }} https://github.com/meshtastic/firmware.git
          cd firmware
          git submodule update --init --recursive

      - name: Patch platformio.ini for RU (Python)
        if: steps.check_release.outputs.skip_build == 'false'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          
          variant_path = os.environ.get('VARIANT_PATH')
          variant_define = os.environ.get('VARIANT_DEFINE')
          
          ini_file = Path(f"firmware/{variant_path}/platformio.ini")
          
          if not ini_file.exists():
              raise FileNotFoundError(f"File not found: {ini_file}")
          
          content = ini_file.read_text()
          
          # Find the line with -I and add -D after it
          lines = content.splitlines()
          new_lines = []
          
          for line in lines:
              new_lines.append(line)
              if f"-I {variant_path}" in line and '-D' not in line:
                  # Add -D line after -I line
                  new_lines.append(f"  -D {variant_define}")
          
          # If no -I line found, append to build_flags
          if variant_define not in '\n'.join(new_lines):
              for i, line in enumerate(new_lines):
                  if 'build_flags' in line and '=' in line:
                      # Append to the same line
                      new_lines[i] = line.rstrip() + f" -D {variant_define}"
                      break
          
          ini_file.write_text('\n'.join(new_lines))
          
          print(f"Patched {ini_file}:")
          print(ini_file.read_text())
          PY
        env:
          VARIANT_PATH: ${{ matrix.variant_path }}
          VARIANT_DEFINE: ${{ matrix.variant_define }}

      - name: Patch RU power_limit
        if: steps.check_release.outputs.skip_build == 'false'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("firmware/src/mesh/RadioInterface.cpp")
          new_power_limit = "30"

          if not path.is_file():
              raise SystemExit(f"File not found: {path}")

          text = path.read_text()

          def split_top_level(value):
              result = []
              start = 0
              depth = 0

              for index, char in enumerate(value):
                  if char == "(":
                      depth += 1
                  elif char == ")":
                      depth -= 1
                  elif char == "," and depth == 0:
                      result.append((start, index))
                      start = index + 1

              result.append((start, len(value)))
              return result

          define_match = re.search(
              r"#define\s+RDEF\s*\((.*?)\)",
              text,
              flags=re.DOTALL,
          )

          if not define_match:
              raise SystemExit("RDEF macro definition was not found")

          define_arguments = define_match.group(1)
          define_params = [
              define_arguments[start:end].strip()
              for start, end in split_top_level(define_arguments)
          ]

          try:
              power_limit_index = define_params.index("power_limit")
          except ValueError:
              raise SystemExit(
                  f"Parameter power_limit was not found in RDEF definition: "
                  f"{define_params}"
              )

          ru_pattern = re.compile(r"\bRDEF\s*\(\s*RU\s*,")
          ru_matches = list(ru_pattern.finditer(text))

          if len(ru_matches) != 1:
              raise SystemExit(
                  f"Expected exactly one RDEF(RU, ...) call, "
                  f"found {len(ru_matches)}"
              )

          match = ru_matches[0]
          opening_parenthesis = text.find("(", match.start(), match.end())

          if opening_parenthesis == -1:
              raise SystemExit("Opening parenthesis of RDEF(RU) was not found")

          depth = 0
          closing_parenthesis = None

          for index in range(opening_parenthesis, len(text)):
              char = text[index]

              if char == "(":
                  depth += 1
              elif char == ")":
                  depth -= 1

                  if depth == 0:
                      closing_parenthesis = index
                      break

          if closing_parenthesis is None:
              raise SystemExit("Closing parenthesis of RDEF(RU) was not found")

          invocation_arguments_start = opening_parenthesis + 1
          invocation_arguments_end = closing_parenthesis

          invocation_arguments = text[
              invocation_arguments_start:invocation_arguments_end
          ]

          argument_spans = split_top_level(invocation_arguments)

          if len(argument_spans) != len(define_params):
              raise SystemExit(
                  f"RDEF(RU) has {len(argument_spans)} arguments, "
                  f"but the macro defines {len(define_params)} parameters"
              )

          argument_start, argument_end = argument_spans[power_limit_index]

          while argument_start < argument_end and \
                  invocation_arguments[argument_start].isspace():
              argument_start += 1

          while argument_end > argument_start and \
                  invocation_arguments[argument_end - 1].isspace():
              argument_end -= 1

          old_power_limit = invocation_arguments[argument_start:argument_end]

          if not old_power_limit.isdigit():
              raise SystemExit(
                  f"power_limit is not a decimal integer: {old_power_limit!r}"
              )

          absolute_start = invocation_arguments_start + argument_start
          absolute_end = invocation_arguments_start + argument_end

          patched_text = (
              text[:absolute_start]
              + new_power_limit
              + text[absolute_end:]
          )

          path.write_text(patched_text)

          print(
              f"Patched RDEF(RU) power_limit: "
              f"{old_power_limit} -> {new_power_limit}"
          )

          for line in patched_text.splitlines():
              if "RDEF(RU" in line:
                  print(line)
          PY

      - name: Build firmware
        if: steps.check_release.outputs.skip_build == 'false'
        run: |
          cd firmware
          pio run -e ${{ matrix.board }} -t buildfs --disable-auto-clean
          pio run -e ${{ matrix.board }}

      - name: Rename binaries with versioned names
        if: steps.check_release.outputs.skip_build == 'false'
        run: |
          cd firmware/.pio/build/${{ matrix.board }}
          for f in *${{ matrix.board }}*.bin; do
            [[ "$f" == *-ru-* ]] && continue
            mv -- "$f" "${f/-${{ matrix.board }}-/-${{ matrix.board }}-ru-}"
          done

      - name: Generate checksums
        if: steps.check_release.outputs.skip_build == 'false'
        id: checksum
        run: |
          cd firmware/.pio/build/${{ matrix.board }}
          for f in firmware-${{ matrix.board }}-ru-*.bin; do
            sha256sum "$f" >> SHA256SUMS.txt
          done
          echo "Checksums generated:"
          cat SHA256SUMS.txt

      - name: Upload firmware binaries (Actions artifacts)
        if: steps.check_release.outputs.skip_build == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board }}-${{ steps.get_release.outputs.ru_tag }}
          path: |
            firmware/.pio/build/${{ matrix.board }}/firmware-${{ matrix.board }}-ru-*.bin
            firmware/.pio/build/${{ matrix.board }}/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: steps.check_release.outputs.skip_build == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_release.outputs.ru_tag }}
          name: Meshtastic RU ${{ matrix.display_name }} ${{ steps.get_release.outputs.tag }}
          body: |
            ✅ Stable build for **${{ matrix.display_name }}** with **RU support**
            🔗 Based on upstream release [${{ steps.get_release.outputs.tag }}](https://github.com/meshtastic/firmware/releases/tag/${{ steps.get_release.outputs.tag }})

            **Checksums (SHA256):**
            ```
            $(cat firmware/.pio/build/${{ matrix.board }}/SHA256SUMS.txt)
            ```

            Firmware attached below 👇
          files: |
            firmware/.pio/build/${{ matrix.board }}/firmware-${{ matrix.board }}-ru-*.bin
            firmware/.pio/build/${{ matrix.board }}/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}